# Production stack for a single VPS. Only nginx ("web") publishes ports (80, 443);
# PostgreSQL and the API are reachable only on the internal Compose network.
# Deploy with scripts/deploy-vps.sh, which obtains the TLS certificate first.
name: consultflow-prod

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: consultflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: consultflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consultflow -d consultflow"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://consultflow:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/consultflow?sslmode=disable
      ADDR: ":8081"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/consultflow", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 30

  web:
    build:
      context: ./frontend
      target: prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/nginx/consultflow.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/nginx/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    # Reload every 6h so renewed certificates are picked up without a restart.
    command: >-
      /bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done &
      exec /docker-entrypoint.sh nginx -g "daemon off;"'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12

  # Renews the Let's Encrypt certificate via nginx's webroot (checks at start and
  # twice a day; renews within 30 days of expiry).
  certbot:
    image: certbot/certbot:v5.8.0
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: >-
      /bin/sh -c 'trap exit TERM; while :; do
      certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $${!}; done'

volumes:
  pgdata:
  letsencrypt:
  certbot-www:
